name: Build

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check-doc-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install slugify
        run: npm install --no-save --package-lock=false slugify@1.6.6

      - name: Check internal links and legacy redirects
        run: python3 scripts/build_hash_redirect_map.py --check

      - name: Check external links
        run: python3 scripts/check-doc-links.py --markdown-dir md

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: check-doc-links

    steps:
      - name: Trigger Vendor documentation deployment
        env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
        run: |
          curl --fail --request POST \
            --form "token=${GITLAB_TRIGGER_TOKEN}" \
            --form "ref=master" \
            --form "variables[deploy_target]=vendor-api" \
            --form "variables[source_sha]=${GITHUB_SHA}" \
            --form "variables[deploy_source]=github" \
            "https://git.company.lognex/api/v4/projects/177/trigger/pipeline"
